name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs on the same branch or PR are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  # GTK 4.12+ is required (the gtk4 `v4_12` feature). Ubuntu 24.04 ships 4.14;
  # 22.04's 4.6 is too old, which is why the runner is pinned.
  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  # Keep in step with `rust-version` in Cargo.toml.
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@1.92
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --locked

  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install desktop-file-utils and appstream
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils appstream
      - run: desktop-file-validate data/*.desktop
      - run: appstreamcli validate --no-net data/*.metainfo.xml
      # Catches a missed bump before the release tag does.
      - run: packaging/check-version.sh
